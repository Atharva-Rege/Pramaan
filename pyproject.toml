[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pramaan"
version = "0.1.0"
description = "Verifiable research agent for Indian company filings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Atharva Rege" }]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "lxml>=5.0",
  "httpx>=0.27",
  "duckdb>=1.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "scipy>=1.11",
  "rapidfuzz>=3.6",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "pillow>=10.3",
  "sqlglot>=25.0",
  "bm25s>=0.2",
  "fastembed>=0.3",
  "faiss-cpu>=1.8",
  "anthropic>=1.0",
  "dspy>=3.4,<3.5",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0", "datasets>=2.19", "accelerate>=0.30"]
ocr = ["pytesseract>=0.3.10"]
graph = ["langgraph>=0.2"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "mcp>=2.0"]
obs = ["opentelemetry-sdk>=1.24", "opentelemetry-exporter-otlp-proto-http>=1.24"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "reportlab>=4.0",
  "nbformat>=5.10",
  "nbclient>=0.10",
  "types-PyYAML",
  "pandas-stubs",
  "jsonschema>=4.21",
]
all = ["pramaan[ml,ocr,graph,serve,obs]"]

[project.scripts]
pramaan = "pramaan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["pramaan"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", "report", "data", "artifacts", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501", "B008", "RUF012", "SIM108", "RUF001", "RUF002", "RUF003", "B905", "RUF059", "E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "pramaan.core.*"
strict = true
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra --strict-markers"
markers = [
  "network: touches the network, skipped unless PRAMAAN_NETWORK=1",
  "realdata: needs collected data under PRAMAAN_HOME",
  "slow: slow test",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
