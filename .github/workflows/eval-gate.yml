name: eval-gate
on:
  pull_request:
    paths:
      - "pramaan/agent/**"
      - "pramaan/verify/**"
      - "pramaan/retrieval/**"
      - "configs/**"
      - "pramaan/llm/**"
permissions:
  contents: read
  pull-requests: write
jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PRAMAAN_HOME: ${{ github.workspace }}/.pramaan
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 && uv pip install torch --index-url https://download.pytorch.org/whl/cpu && uv pip install -e ".[serve]"
      - name: restore LLM cache
        uses: actions/cache@v4
        with:
          path: .pramaan/cache
          key: llm-cache-${{ github.base_ref }}-${{ github.sha }}
          restore-keys: llm-cache-${{ github.base_ref }}-
      - name: fetch data snapshot
        run: |
          mkdir -p .pramaan
          curl -L -o snapshot.zip "${{ vars.SNAPSHOT_URL }}"
          unzip -q snapshot.zip -d .pramaan
      - name: run the 60 frozen dev questions with the small model
        run: |
          uv run python scripts/gate_run.py --qids ci/gate_qids.json --out ci/current.json --cap 0.90
      - name: decide
        id: decide
        run: uv run python scripts/eval_gate.py --current ci/current.json
        continue-on-error: true
      - name: comment on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('ci/gate_comment.md', 'utf8');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
      - name: fail when blocked
        if: steps.decide.outcome == 'failure'
        run: exit 1
