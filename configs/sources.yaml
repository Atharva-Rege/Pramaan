nse:
  base: https://www.nseindia.com
  archives: https://nsearchives.nseindia.com
  integrated_results: /api/integrated-filing-results
  announcements: /api/corporate-announcements
  nifty200_csv: https://nsearchives.nseindia.com/content/indices/ind_nifty200list.csv
  min_interval_s: 2.0
  timeout_s: 60
  window_days: 100
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
    Accept: "application/json, text/plain, */*"
    Accept-Language: "en-US,en;q=0.9"
  financial_type: "Integrated Filing- Financials"
  xbrl_marker: INTEGRATED_FILING_INDAS
  outcome_descs:
    - Outcome of Board Meeting
    - Financial Results
    - Integrated Filing- Financials
  timezone_offset_minutes: 330

bse:
  api: https://api.bseindia.com/BseIndiaAPI/api
  announcements: /AnnSubCategoryGetData/w
  attachment_base: https://www.bseindia.com/xml-data/corpfiling/AttachLive
  min_interval_s: 2.0
  timeout_s: 60
  window_days: 7
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36"
    Accept: "application/json, text/plain, */*"
    Accept-Language: "en-US,en;q=0.5"
    Origin: https://www.bseindia.com
    Referer: https://www.bseindia.com/corporates/ann
    Sec-Fetch-Site: same-site
    Sec-Fetch-Mode: cors
    Sec-Fetch-Dest: empty
    sec-ch-ua: '"Chromium";v="153", "Not(A:Brand";v="24"'
    sec-ch-ua-mobile: "?0"
    sec-ch-ua-platform: '"Windows"'

universe:
  nifty200: true
  other_sample_size: 150
  sample_seed: 20261002
  exclude_name_patterns:
    - "(?i)\\bbank\\b"
    - "(?i)\\binsurance\\b"
    - "(?i)\\bfinance\\b"
    - "(?i)\\bfinancial services\\b"
    - "(?i)\\bhousing finance\\b"
    - "(?i)\\bcapital\\b"
    - "(?i)\\bmutual fund\\b"
    - "(?i)\\basset management\\b"
    - "(?i)\\bsecurities\\b"
    - "(?i)\\bholdings\\b"
